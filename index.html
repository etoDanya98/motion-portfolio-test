<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Тестовая страница проекта — моушен-дизайн и анимация.">
<title>Название проекта — Motion portfolio</title>
<style>
*{box-sizing:border-box} :root{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;font-synthesis:none} body{margin:0}button{font:inherit}button:focus-visible{outline:3px solid #6b51f5;outline-offset:5px}button{touch-action:manipulation} .page{padding:36px 4vw 25px;max-width:2200px;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid #ddd;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.brand{font-weight:700}.status{display:flex;align-items:center;gap:8px;color:#666}.status:before{content:"";width:6px;height:6px;background:#111;border-radius:50%}.layout{display:grid;grid-template-columns:minmax(140px,.65fr) minmax(0,3fr) minmax(0,1.7fr);grid-template-rows:auto 1fr;gap:32px 34px;padding-top:32px}.intro{grid-column:1/3;padding:0 0 12px}h1{font-size:clamp(34px,4.4vw,88px);font-weight:400;letter-spacing:-.055em;line-height:1.04;margin:0 0 18px} .description{font-size:clamp(17px,1.8vw,32px);line-height:1.35;letter-spacing:-.025em;margin:0;color:#555;max-width:35em}.meta{grid-column:1;grid-row:2;padding-top:18px}dl{margin:0} .meta div{margin-bottom:28px}dt{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#777;margin-bottom:9px}dd{font-size:14px;line-height:1.5;margin:0}.main-figure{grid-column:2;grid-row:2;margin:0;min-width:0}.side{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;gap:24px}.frame{--cut:17px;position:relative;background:#111;padding:clamp(16px,2.9vw,56px);clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));width:100%;border:0;display:block;text-align:inherit;cursor:zoom-in;isolation:isolate}.frame:focus-visible{clip-path:none;outline-offset:2px}.main-frame{height:clamp(400px,61vh,850px);min-height:390px}.side-frame{aspect-ratio:1.25}.side figure{margin:0}.scene{position:relative;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}.mint{background:#c7f2dc}.lavender{background:#d8d1f4}.ivory{background:#f2f0e9}.scene-label{position:absolute;left:7%;top:7%;font-size:9px;letter-spacing:.16em;z-index:3}.scene-bottom{position:absolute;bottom:6%;left:7%;right:7%;display:flex;justify-content:space-between;align-items:flex-end;font-size:9px;letter-spacing:.12em;z-index:3}.scene-bottom strong{font-size:clamp(22px,3.7vw,70px);font-weight:500;line-height:.85;letter-spacing:-.07em}.sculpture{position:absolute;width:75%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transform:rotate(-25deg);animation:turn 14s ease-in-out infinite}.ring{position:absolute;width:76%;height:34%;border:clamp(14px,2.5vw,46px) solid #161616;border-radius:50%;box-shadow:inset 0 3px 0 #686868,0 6px 0 #454545,0 15px 18px #16291b26;background:transparent}.ring:nth-child(1){transform:rotate(0deg)}.ring:nth-child(2){transform:rotate(60deg)}.ring:nth-child(3){transform:rotate(120deg)}.core{width:20%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0,#f5f4ef 25%,#b2b1a6 80%);box-shadow:8px 14px 18px #1113;animation:breathe 4s ease-in-out infinite}.cross{position:absolute;right:7%;top:7%;font-size:20px;line-height:.6;font-weight:400}.caption{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px;color:#777;font-size:10px;letter-spacing:.06em}.caption span:first-child{color:#333}.control{border:0;background:transparent;padding:6px 0 6px 10px;cursor:pointer;color:#333;font-size:10px;display:flex;gap:7px;align-items:center}.pause-icon{width:7px;height:9px;border-left:2px solid;border-right:2px solid}.paused .pause-icon{border:0;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid}.paused *{animation-play-state:paused!important}.detail-shape{width:64%;aspect-ratio:1;position:relative;transform:rotate(-20deg)}.detail-shape i{position:absolute;inset:8%;border:clamp(8px,1.6vw,30px) solid #151515;border-radius:50%;transform:rotateX(58deg);box-shadow:0 5px 0 #555}.detail-shape i:nth-child(2){transform:rotate(60deg) rotateX(58deg)}.detail-shape i:nth-child(3){transform:rotate(120deg) rotateX(58deg)}.type-art{font-size:clamp(35px,5.2vw,100px);font-weight:700;letter-spacing:-.09em;line-height:.78;text-align:center;transform:rotate(-8deg);animation:typeMove 6s ease-in-out infinite}.type-art span{display:block}.type-art span:nth-child(2){color:transparent;-webkit-text-stroke:1.5px #111}.footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #ddd;padding-top:14px;margin-top:30px;color:#777;font-size:10px;line-height:1.5}.demo{max-width:400px;text-align:right}dialog{padding:0;border:0;background:#111;width:min(1100px,94vw);max-height:94dvh;overflow:auto}dialog::backdrop{background:#000b;backdrop-filter:blur(7px)}.modal-top{display:flex;align-items:center;justify-content:space-between;color:white;padding:14px 20px;font-size:12px}.close{background:transparent;color:white;border:1px solid #555;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:22px}.modal-content{aspect-ratio:1.3;max-height:76dvh}.modal-content>.scene{min-height:250px}.modal-content .scene-bottom strong{font-size:70px}.modal-content .ring{border-width:35px}.modal-content .type-art{font-size:130px}@keyframes turn{0%,100%{transform:rotate(-25deg) scale(.94)}50%{transform:rotate(155deg) scale(1.05)}}@keyframes breathe{50%{transform:scale(.8)}}@keyframes typeMove{0%,100%{transform:rotate(-8deg) scale(.94)}50%{transform:rotate(8deg) scale(1.06)}}@media(min-width:1600px){.page{padding-top:42px}.layout{gap:38px 50px;padding-top:40px}.meta dd{font-size:18px}.meta dt{font-size:11px}.side{gap:30px}.main-frame{height:65vh}.caption,.control,.footer{font-size:12px}}
@media(max-width:950px){.page{padding:22px}.layout{grid-template-columns:145px minmax(0,1fr);gap:28px 22px}.intro{grid-column:1/3}.side{grid-column:1/3;grid-row:3;display:grid;grid-template-columns:1fr 1fr;gap:22px}.main-frame{height:auto;aspect-ratio:1.05;min-height:0}.frame{padding:25px}.ring{border-width:24px}.main-frame .scene-bottom strong{font-size:44px}.side .type-art{font-size:70px}.side .detail-shape i{border-width:18px}}
@media(max-width:560px){.page{padding:18px}.topline{font-size:9px;padding-bottom:13px}.layout{display:flex;flex-direction:column;gap:22px;padding-top:25px}.intro{padding:0}h1{font-size:42px;margin-bottom:13px;max-width:330px}.description{font-size:18px;max-width:300px}.meta{padding:0}dl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.meta div{margin:0}dt{font-size:8px}dd{font-size:11px}.main-frame{aspect-ratio:.9;padding:22px;--cut:13px}.side{display:grid;gap:16px}.side-frame{padding:13px;--cut:9px;aspect-ratio:.88}.scene-label,.scene-bottom{font-size:7px}.side .scene-label{font-size:6px}.side .type-art{font-size:39px}.side .detail-shape{width:82%}.side .detail-shape i{border-width:10px}.caption{font-size:8px;letter-spacing:0}.control{font-size:9px}.footer{font-size:9px;margin-top:22px}.demo{max-width:190px}.modal-content .type-art{font-size:90px}.modal-content .ring{border-width:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="page">
 <header class="topline"><span class="brand">Motion portfolio</span><span class="status">Проект / 001</span></header>
 <article class="layout">
  <div class="intro"><h1>Название проекта</h1><p class="description">Короткая история о форме, ритме<br>и движении.</p></div>
  <aside class="meta" aria-label="Информация о проекте"><dl><div><dt>Клиент</dt><dd>Название клиента</dd></div><div><dt>Моя роль</dt><dd>Дизайн<br>и анимация</dd></div><div><dt>Агентство</dt><dd>Название агентства</dd></div></dl></aside>
  <figure class="main-figure">
   <button class="frame main-frame" data-expand aria-label="Увеличить основную анимацию">
    <div class="scene mint" role="img" aria-label="Демонстрационная анимация: три чёрных кольца вращаются вокруг светлой сферы"><span class="scene-label">FORM STUDY / 01</span><span class="cross" aria-hidden="true">+</span><div class="sculpture" aria-hidden="true"><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="core"></i></div><div class="scene-bottom"><strong>In motion.</strong><span>LOOP ↻</span></div></div>
   </button>
   <figcaption class="caption"><span>01 — Основная анимация</span><button class="control" id="toggle" aria-pressed="false"><i class="pause-icon" aria-hidden="true"></i><span>Пауза</span></button></figcaption>
  </figure>
  <div class="side">
   <figure><button class="frame side-frame" data-expand aria-label="Увеличить кадр с деталями"><div class="scene lavender" role="img" aria-label="Статичный кадр: чёрные пересекающиеся кольца на сиреневом фоне"><span class="scene-label">DETAIL / 02</span><span class="cross" aria-hidden="true">+</span><div class="detail-shape" aria-hidden="true"><i></i><i></i><i></i></div></div></button><figcaption class="caption"><span>02 — Детали и форма</span><span>КАДР</span></figcaption></figure>
   <figure><button class="frame side-frame" data-expand aria-label="Увеличить типографическую анимацию"><div class="scene ivory" role="img" aria-label="Демонстрационная типографическая анимация со словами MAKE IT MOVE"><span class="scene-label">TYPE STUDY / 03</span><span class="cross" aria-hidden="true">+</span><div class="type-art" aria-hidden="true"><span>MAKE</span><span>IT</span><span>MOVE</span></div></div></button><figcaption class="caption"><span>03 — Типографика в движении</span><span>LOOP ↻</span></figcaption></figure>
  </div>
 </article>
 <footer class="footer"><span>Дизайн в движении.<br>2026</span><span class="demo">Тестовая страница · демонстрационные материалы</span></footer>
</main>
<dialog id="viewer" aria-label="Просмотр работы"><div class="modal-top"><span id="modal-title">Просмотр работы</span><button class="close" aria-label="Закрыть просмотр">×</button></div><div class="modal-content"></div></dialog>
<script>
const viewer=document.querySelector('#viewer');
document.querySelectorAll('[data-expand]').forEach(button=>button.addEventListener('click',()=>{
 document.querySelector('.modal-content').replaceChildren(button.querySelector('.scene').cloneNode(true));
 document.querySelector('#modal-title').textContent=button.closest('figure').querySelector('figcaption span').textContent;
 viewer.showModal();
}));
document.querySelector('.close').addEventListener('click',()=>viewer.close());
viewer.addEventListener('click',event=>{if(event.target===viewer){const r=viewer.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)viewer.close()}});
document.querySelector('#toggle').addEventListener('click',event=>{const paused=document.body.classList.toggle('paused');const button=event.currentTarget;button.setAttribute('aria-pressed',String(paused));button.querySelector('span').textContent=paused?'Продолжить':'Пауза'});
</script>
</body>
</html>
